    <mask id="e"><rect width="512" height="512" fill="#fff"/><circle cx="300" cy="212" r="160" fill="#000"/></mask>
  </defs>
  <circle cx="240" cy="272" r="200" fill="url(#l)" mask="url(#e)"/>
</svg>
