<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Shadow — marque « éclipse » : un disque d'ombre passe devant la lumière, il reste le croissant. -->
  <defs>
    <linearGradient id="fond" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#1A1A30"/>
      <stop offset="1" stop-color="#08080D"/>
    </linearGradient>
    <linearGradient id="lumiere" gradientUnits="userSpaceOnUse" x1="120" y1="400" x2="390" y2="120">
      <stop offset="0" stop-color="#FF4D8D"/>
      <stop offset="0.5" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#D9D2FF"/>
    </linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="230" cy="290" r="230">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#7C6CFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="eclipse">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="298" cy="214" r="126" fill="#000"/>
    </mask>
    <filter id="flou" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="zoneLumiere">
      <circle cx="250" cy="262" r="150"/>
    </clipPath>
    <clipPath id="forme">
      <path id="sq" d="M256 0C460 0 512 52 512 256S460 512 256 512 0 460 0 256 52 0 256 0Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#forme)">
    <rect width="512" height="512" fill="url(#fond)"/>
    <rect width="512" height="512" fill="url(#halo)"/>
    <!-- lueur puis croissant net -->
    <circle cx="250" cy="262" r="146" fill="url(#lumiere)" mask="url(#eclipse)" filter="url(#flou)" opacity="0.9"/>
    <circle cx="250" cy="262" r="146" fill="url(#lumiere)" mask="url(#eclipse)"/>
    <!-- disque d'ombre : même matière que le fond, seule une couronne le trahit -->
    <circle cx="298" cy="214" r="126" fill="url(#fond)"/>
    <circle cx="298" cy="214" r="126" fill="none" stroke="url(#lumiere)" stroke-opacity="0.35" stroke-width="2.5" clip-path="url(#zoneLumiere)"/>
    <rect width="512" height="512" fill="url(#verre)"/>
  </g>
  <path d="M256 1.5C459 1.5 510.5 53 510.5 256S459 510.5 256 510.5 1.5 459 1.5 256 53 1.5 256 1.5Z" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="3"/>
</svg>
