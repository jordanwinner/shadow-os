<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="croissant"><rect width="128" height="128" fill="#fff"/><circle cx="71" cy="49" r="24" fill="#000"/></mask>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#fond)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#reflet)"/>
  <!-- croissant d'éclipse -->
  <circle cx="62" cy="55" r="29" fill="#fff" mask="url(#croissant)"/>
  <!-- sélecteur de modes : un actif, trois en attente -->
  <rect x="28" y="92" width="30" height="10" rx="5" fill="#fff"/>
  <circle cx="70" cy="97" r="5" fill="#fff" fill-opacity=".5"/>
  <circle cx="84" cy="97" r="5" fill="#fff" fill-opacity=".5"/>
  <circle cx="98" cy="97" r="5" fill="#fff" fill-opacity=".5"/>
</svg>
